[project]
name = "pgcypher"
version = "0.1.0"
description = "Run Apache AGE style Cypher queries on managed PostgreSQL (RDS, Cloud SQL) without the C extension"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Jonathan Wrede" }]
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pgcypher = "pgcypher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgcypher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
