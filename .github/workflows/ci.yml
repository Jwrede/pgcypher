name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      age:
        image: apache/age:release_PG18_1.8.0
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGCYPHER_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:55432/postgres
      PGCYPHER_AGE_DSN: postgresql://postgres:postgres@127.0.0.1:55433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Tests (differential against Apache AGE, proxy, units)
        run: python -m pytest -v -rs
      - name: Example through the proxy with psql
        run: |
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -p 55432 -U postgres -c "CREATE ROLE demo LOGIN PASSWORD 'demo'" -c "CREATE DATABASE demo OWNER demo"
          pgcypher install postgresql://demo:demo@127.0.0.1:55432/demo
          pgcypher proxy --listen 127.0.0.1:5433 --upstream 127.0.0.1:55432 &
          sleep 2
          PGPASSWORD=demo psql -v ON_ERROR_STOP=1 "postgresql://demo@127.0.0.1:5433/demo" -f examples/demo.sql | tee out.txt
          grep -q '"Carol"' out.txt
